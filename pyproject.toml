[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "market-manipulation-surveillance"
version = "1.0.0"
description = "Level-3 order book surveillance for spoofing, layering, wash trading, marking the close and front-running"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
realdata = ["pandas>=2.0"]
dev = ["pandas>=2.0", "pytest>=8.0", "pytest-cov>=5.0", "httpx2>=2.0", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
mktsurv = "mktsurv.__main__:main"

[tool.setuptools]
packages = ["mktsurv"]

[tool.setuptools.package-data]
mktsurv = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["mktsurv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905"]  # Depends() defaults are FastAPI's idiom; zip(strict=) is style
